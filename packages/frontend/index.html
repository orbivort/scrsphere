<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrumooth v%__APP_VERSION__%</title>
    <script>
      // Single Page Apps for GitHub Pages - SPA redirect handling
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script checks if we were redirected from a 404 and restores the URL
      (function() {
        // Check if we have a redirect stored in sessionStorage
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        
        // If we have a redirect and it's different from current location, restore it
        if (redirect && redirect !== location.href) {
          // Replace the current history state with the correct URL
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
