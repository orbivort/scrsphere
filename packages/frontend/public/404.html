<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scrumooth - Redirecting...</title>
    <script>
      (function(l) {
        sessionStorage.redirect = l.href;
        var basePath = '/';
        if (l.pathname.indexOf('/', 1) > 0) {
          basePath = l.pathname.substring(0, l.pathname.indexOf('/', 1) + 1);
        }
        l.replace(basePath);
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      <h1>Scrumooth</h1>
      <p>JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p>
    </noscript>
  </body>
</html>
