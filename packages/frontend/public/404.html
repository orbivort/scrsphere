<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScrSphere - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script handles SPA routing on GitHub Pages by redirecting 404s to index.html
      
      // The number of path segments to keep
      // For username.github.io (user site), set to 0
      // For username.github.io/repo-name (project site), set to 1
      var pathSegmentsToKeep = 0;
      
      var l = window.location;
      
      // Construct the redirect URL
      // Keep the first 'pathSegmentsToKeep' segments, then add the rest as query params
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '\\and') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <h1>ScrSphere</h1>
      <p>JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p>
    </noscript>
  </body>
</html>
