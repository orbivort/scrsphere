<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="scrumoothGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Iteration arc: Scrum sprint cycle -->
  <path
    d="M 61 30 A 24 24 0 0 1 61 70"
    stroke="url(#scrumoothGrad)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.28"
  />

  <!-- Flowing S-curve: Scrumooth workflow -->
  <path
    d="M 70 26 C 70 12 30 12 30 32 C 30 46 50 50 50 50 C 50 50 70 54 70 68 C 70 88 30 88 30 74"
    stroke="url(#scrumoothGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Iteration pulse: sprint heartbeat -->
  <circle cx="50" cy="50" r="6.5" stroke="url(#scrumoothGrad)" stroke-width="1.8" fill="none" opacity="0.5"/>
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.95"/>
</svg>
