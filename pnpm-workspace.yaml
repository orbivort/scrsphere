packages:
  - 'packages/*'

# pnpm v11 configuration
autoInstallPeers: true
engineStrict: true
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.13.1
  '@typescript-eslint/eslint-plugin': ^8.60.1
  '@typescript-eslint/parser': ^8.60.1
  '@vitest/coverage-v8': ^4.1.8
  '@vitest/ui': ^4.1.8
  cross-env: ^10.1.0
  eslint: ^10.4.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.2
  globals: ^17.6.0
  prettier: ^3.8.3
  rimraf: ^6.1.3
  stylelint: ^17.13.0
  stylelint-config-standard: ^40.0.0
  tsx: ^4.22.4
  typescript: ^6.0.3
  typescript-eslint: ^8.60.1
  vitest: ^4.1.8

# Build configuration for pnpm v11
allowBuilds:
  bcrypt: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true

strictPeerDependencies: false

# Package overrides (migrated from package.json)
overrides:
  brace-expansion: ^5.0.7 # Fixed: GHSA-3jxr-9vmj-r5cp high severity DoS vulnerability
  esbuild: ^0.28.1 # Fixed: GHSA-gv7w-rqvm-qjhr high severity vulnerability
  glob: ^11.1.0 # Fixed: GHSA-5j98-mcp5-4vw2 command injection vulnerability
  ini: ^4.1.3 # Fixed: GHSA-qqgx-2p2h-9c37 prototype pollution vulnerability
  follow-redirects: ^1.16.0
  '@hono/node-server': ^2.0.5 # Fixed: GHSA-frvp-7c67-39w9 moderate path traversal vulnerability
  fast-uri: ^3.1.4 # Fixed: GHSA-v2hh-gcrm-f6hx and GHSA-4c8g-83qw-93j6 high severity host confusion vulnerabilities
  form-data: ^4.0.6 # Fixed: GHSA-hmw2-7cc7-3qxx CRLF injection vulnerability
  hono: ^4.12.27 # Fixed: GHSA-xgm2-5f3f-mvvc, GHSA-hvrm-45r6-mjfj, GHSA-w62v-xxxg-mg59 moderate vulnerabilities
  js-yaml: ^4.3.0 # Fixed: GHSA-52cp-r559-cp3m high severity quadratic CPU consumption vulnerability
  shell-quote: ^1.8.5 # Fixed: GHSA-395f-4hp3-45gv high severity DoS vulnerability
  body-parser: ^2.3.0 # Fixed: GHSA-v422-hmwv-36x6 low severity DoS vulnerability
  qs: ^6.15.2
  https-proxy-agent: ^7.0.6
  undici: ^7.28.0

# Peer dependency rules (migrated from package.json)
peerDependencyRules:
  allowedVersions:
    eslint: ^10.0.0

# Security and Supply Chain Protection (pnpm v11 best practices)
minimumReleaseAge: 1440 # 24 hours - prevents zero-day supply chain attacks
minimumReleaseAgeExclude:
  # packages excluded from minimumReleaseAge check
  - stylelint # recently published, verified safe
blockExoticSubdeps: true # blocks exotic URL dependencies (git, gist, etc.)
strictDepBuilds: true # ensures build scripts only run for allowed packages

# Performance Optimizations
optimisticRepeatInstall: true # speeds up repeat installs
verifyDepsBeforeRun: install # verifies dependencies before running scripts

# Audit Configuration
auditConfig:
  registry: https://registry.npmjs.org/ # use official registry for security audits
