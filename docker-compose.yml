  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - scrumooth-network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "5"
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 128M
  #       reservations:
  #         cpus: '0.1'
  #         memory: 32M

  # ===========================================================================
  # Automated SQL Backup Service
  # Creates SQL dumps of the database daily at 2 AM
  # ===========================================================================
  backup:
    image: postgres:18-alpine
    container_name: scrumooth-backup
    volumes:
      - ./backups:/backups
      - ./scripts/maintenance/database:/scripts:ro
    environment:
      - POSTGRES_USER=${DB_USER:-scrumooth}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Str0ng!DBp@ss2026}
      - DB_NAME=${DB_NAME:-scrumooth}
      - PGHOST=postgres
    command: >
      sh -c "
        apk add --no-cache bash &&
        echo '0 2 * * * cd /scripts && ./db-backup.sh /backups >> /backups/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scrumooth-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Automated Volume Backup Service
  # Creates file-level backups of the PostgreSQL data volume weekly on Sundays at 3 AM
  # ===========================================================================
  volume-backup:
    image: docker:cli
    container_name: scrumooth-volume-backup
    volumes:
      - scrumooth_postgres_data:/data:ro
      - ./backups/volumes:/backups
      - ./scripts/maintenance/database:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      sh -c "
        apk add --no-cache bash &&
        echo '0 3 * * 0 cd /scripts && ./db-volume-backup.sh /backups >> /backups/volume-backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scrumooth-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  scrumooth_postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  scrumooth-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
