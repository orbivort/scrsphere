# =============================================================================
# Scrumooth - Production Docker Compose Configuration
# =============================================================================
# Production-ready orchestration with security best practices
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # Caddy Reverse Proxy with automatic HTTPS
  # Handles TLS termination and SSL certificate management
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: scrumooth-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrumooth-network
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ===========================================================================
  # Backend API Service
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: production
      args:
        VERSION: "1.5.1"
        BUILD_DATE: "${BUILD_DATE:-}"
        VCS_REF: "${VCS_REF:-}"
    image: scrumooth-backend:${VERSION:-latest}
    container_name: scrumooth-backend
    expose:
      - "5000"
    env_file:
      - ./packages/backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrumooth-network
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem with writable paths
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # Frontend Service (Nginx)
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: production
      args:
        VERSION: "1.5.1"
        BUILD_DATE: "${BUILD_DATE:-}"
        VCS_REF: "${VCS_REF:-}"
    image: scrumooth-frontend:${VERSION:-latest}
    container_name: scrumooth-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrumooth-network
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem with writable paths for nginx
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: scrumooth-postgres
    env_file:
      - ./packages/backend/.env.production
    environment:
      - POSTGRES_USER=${DB_USER:-scrumooth}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Str0ng!DBp@ss2026}
      - POSTGRES_DB=${DB_NAME:-scrumooth}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.UTF-8
    volumes:
      - scrumooth_postgres_data:/var/lib/postgresql
      - ./logs/postgres:/var/log/postgresql
    restart: unless-stopped
    networks:
      - scrumooth-network
    # Security options
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrumooth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # PostgreSQL with logging enabled
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d_%H%M%S.log"
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "

  # ===========================================================================
  # PgBouncer - Connection Pooling for Production
  # NOTE: Commented out due to Docker mirror availability issues.
  # Uncomment and configure if you have access to bitnami/pgbouncer or edoburu/pgbouncer images.
  # ===========================================================================
  # pgbouncer:
  #   image: bitnami/pgbouncer:1.22
  #   container_name: scrumooth-pgbouncer
  #   environment:
  #     PGBOUNCER_DATABASE_HOST: postgres
  #     PGBOUNCER_DATABASE_PORT_NUMBER: 5432
  #     PGBOUNCER_DATABASE_NAME: ${DB_NAME:-scrumooth}
  #     PGBOUNCER_DATABASE_USER: ${DB_USER:-postgres}
  #     PGBOUNCER_DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
  #     PGBOUNCER_POOL_MODE: transaction
  #     PGBOUNCER_MAX_CLIENT_CONN: 100
  #     PGBOUNCER_DEFAULT_POOL_SIZE: 20
  #     PGBOUNCER_MIN_POOL_SIZE: 5
  #     PGBOUNCER_RESERVE_POOL_SIZE: 5
  #     PGBOUNCER_MAX_DB_CONNECTIONS: 50
  #     PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
  #     PGBOUNCER_SERVER_LIFETIME: 3600
  #     PGBOUNCER_CLIENT_IDLE_TIMEOUT: 0
  #     PGBOUNCER_CLIENT_LOGIN_TIMEOUT: 60
  #     PGBOUNCER_QUERY_TIMEOUT: 0
  #     PGBOUNCER_QUERY_WAIT_TIMEOUT: 120
  #   ports:
  #     - "6432:6432"
